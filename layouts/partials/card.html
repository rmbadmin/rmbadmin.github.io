<article class="post-card"><div class="card-top"><time>{{ .Date.Format "2006 / 01 / 02" }}</time></div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p class="excerpt">{{ .Plain | truncate 110 }}</p><div class="card-bottom"><div class="chips">{{ range first 2 .Params.categorylinks }}<a class="chip" href="{{ .url }}">{{ .name }}</a>{{ end }}</div><a class="read-link" href="{{ .RelPermalink }}">阅读全文 ↗</a></div></article>
